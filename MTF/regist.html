<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深上奶茶 · 注册</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="brand-panel">
            <div class="brand-mark">SHENSHANG</div>
            <div>
                <h1>创建账号</h1>
                <p>注册后即可浏览招牌奶茶、加入购物车并提交订单。</p>
            </div>
        </section>

        <section class="auth-card">
            <p class="eyebrow">JOIN US</p>
            <h2>注册账号</h2>

            <label class="field" for="txt-username">
                用户名
                <input type="text" id="txt-username" placeholder="请输入用户名" autocomplete="username">
            </label>

            <label class="field" for="txt-password">
                密码
                <input type="password" id="txt-password" placeholder="请输入密码" autocomplete="new-password">
            </label>

            <label class="field" for="txt-tel">
                手机号
                <input type="tel" id="txt-tel" placeholder="请输入手机号" autocomplete="tel">
            </label>

            <button class="primary-btn" id="btn-register">注册</button>

            <div class="auth-link">
                已有账号？<a href="login.html">立即登录</a>
            </div>
        </section>
    </main>

    <script src="axios.js"></script>
    <script>
        const txt_username = document.querySelector("#txt-username");
        const txt_password = document.querySelector("#txt-password");
        const txt_tel = document.querySelector("#txt-tel");
        const btn_register = document.querySelector("#btn-register");

        btn_register.onclick = async function () {
            const username = txt_username.value.trim();
            const password = txt_password.value.trim();
            const tel = txt_tel.value.trim();

            if (!username || !password || !tel) {
                alert("请填写用户名、密码和手机号");
                return;
            }

            try {
                const resp = await axios.get("http://127.0.0.1:8080/webapp/user", {
                    params: {
                        op: "register",
                        username: username,
                        password: password,
                        tel: tel
                    }
                });

                if (resp.data == 1) {
                    alert("注册成功，请登录");
                    location.href = "login.html";
                } else {
                    alert("注册失败，请稍后再试");
                }
            } catch (error) {
                alert("注册失败，请确认后端服务已启动");
            }
        };
    </script>
</body>
</html>
